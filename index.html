<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="Jarvis AI">
 <title>Джарвис — Личный ИИ-Секретарь</title>
 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
 body { background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }
 header { background: #131a2a; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
 .profile { display: flex; align-items: center; gap: 12px; }
 .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #7c3aed); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
 .info h1 { font-size: 16px; font-weight: 600; }
 .info p { font-size: 12px; color: #34d399; }
 #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
 .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; line-height: 1.45; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; }
 .user { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
 .ai { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
 .msg img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
 .input-bar { background: #131a2a; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #1e293b; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
 input[type="text"] { flex: 1; background: #0b0f19; border: 1px solid #334155; color: white; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
 button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
 button.send { background: #2563eb; border: none; color: white; }
 button.recording { background: #ef4444; border-color: #ef4444; animation: pulse 1.2s infinite; }
 @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
 </style>
</head>
<body>
 <header>
 <div class="profile">
 <div class="avatar">AI</div>
 <div class="info">
 <h1>Джарвис • Секретарь</h1>
 <p>● В сети • Готов к работе</p>
 </div>
 </div>
 </header>

 <div id="chat">
 <div class="msg ai">Привет! Я твой персональный секретарь. Можем поболтать текстом или голосом (нажми на микрофон), составить план дел или обработать твоё фото — просто прикрепи его скрепкой!</div>
 </div>

 <div class="input-bar">
 <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
 <button onclick="document.getElementById('photoInput').click()" title="Обработать фото"> </button>
 <button id="micBtn" onclick="toggleVoice()" title="Говорить голосом"> </button>
 <input type="text" id="textInput" placeholder="Напишите или скажите..." onkeydown="if(event.key==='Enter') sendMessage()">
 <button class="send" onclick="sendMessage()">➤</button>
 </div>

 <script>
 const SYSTEM_PROMPT = "Ты — умный, харизматичный и живой личный секретарь пользователя. Общайся на русском языке как настоящий человек: тепло, энергично, с лёгким юмором и без канцеляризмов. Помогай с задачами, идеями, текстами и планированием. Отвечай лаконично и по делу, как в живом мессенджере.";
 let messages = [{ role: "system", content: SYSTEM_PROMPT }];
 const chat = document.getElementById("chat");

 function addMessage(text, sender, imgUrl = null) {
 const div = document.createElement("div");
 div.className = `msg ${sender}`;
 div.textContent = text;
 if (imgUrl) {
 const img = document.createElement("img");
 img.src = imgUrl;
 div.appendChild(img);
 }
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
 }

 function speak(text) {
 if (!('speechSynthesis' in window)) return;
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = 'ru-RU';
 utterance.rate = 1.05;
 window.speechSynthesis.speak(utterance);
 }

 async function sendMessage(voiceText = null) {
 const input = document.getElementById("textInput");
 const text = voiceText || input.value.trim();
 if (!text) return;

 addMessage(text, "user");
 if (!voiceText) input.value = "";
 messages.push({ role: "user", content: text });

 const loading = addMessage("Печатает...", "ai");

 try {
 const response = await fetch("https://pollinations.ai", {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({
 model: "openai",
 messages: messages
 })
 });

 const rawText = await response.text();
 let reply = "";
 try {
 const data = JSON.parse(rawText);
 const choice = Array.isArray(data.choices) ? data.choices.at(0) : null;
 reply = (choice && choice.message && choice.message.content) ? choice.message.content : rawText;
 } catch (e) {
 reply = rawText;
 }

 if (!reply || !reply.trim()) reply = "Не удалось получить ответ, попробуй ещё раз.";
 loading.textContent = reply.trim();
 messages.push({ role: "assistant", content: reply.trim() });
 if (voiceText) speak(reply.trim());
 } catch (err) {
 loading.textContent = "Ошибка сети: " + err.message;
 }
 }

 function toggleVoice() {
 const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
 if (!SpeechRecognition) {
 alert("Голосовой ввод работает в Safari на iPhone или в Chrome.");
 return;
 }
 const recognition = new SpeechRecognition();
 recognition.lang = 'ru-RU';
 const btn = document.getElementById("micBtn");

 recognition.onstart = () => btn.classList.add("recording");
 recognition.onend = () => btn.classList.remove("recording");
 recognition.onresult = (e) => {
 const firstResult = e.results && e.results.item(0) && e.results.item(0).item(0);
 if (firstResult) sendMessage(firstResult.transcript);
 };
 recognition.start();
 }

 function handlePhoto(event) {
 const file = event.target.files && event.target.files.item(0);
 if (!file) return;
 const reader = new FileReader();
 reader.onload = function(e) {
 const img = new Image();
 img.onload = function() {
 const canvas = document.createElement("canvas");
 canvas.width = img.width;
 canvas.height = img.height;
 const ctx = canvas.getContext("2d");
 ctx.filter = "contrast(1.16) saturate(1.22) brightness(1.04)";
 ctx.drawImage(img, 0, 0);
 const resultUrl = canvas.toDataURL("image/jpeg", 0.92);

 addMessage("Обработай это фото!", "user", e.target.result);
 setTimeout(() => {
 addMessage("Готово! Я усилил цвета, добавил контраст и глубину кадра. Зажми картинку, чтобы сохранить её себе на телефон:", "ai", resultUrl);
 }, 700);
 };
 img.src = e.target.result;
 };
 reader.readAsDataURL(file);
 }
 </script>
</body>
</html>
